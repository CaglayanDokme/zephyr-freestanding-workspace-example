# Kconfig fragment the Debug presets merge on top of prj.conf (EXTRA_CONF_FILE in
# CMakePresets.json). The Release presets do not use it and build Zephyr's defaults.

# -Og instead of the default -Os. CMAKE_BUILD_TYPE has no say in this: Zephyr takes the
# optimization level from this Kconfig choice (Kconfig.zephyr, "Optimization level").
CONFIG_DEBUG_OPTIMIZATIONS=y

# Exports the kernel struct offsets that OpenOCD's Zephyr RTOS awareness and the RTOS Views
# panel read; selects THREAD_MONITOR and THREAD_NAME (32 bytes of RAM per thread).
CONFIG_DEBUG_THREAD_INFO=y
